<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Analisador de Escanteios - Beta</title>
    <style>
        body { background-color: #0d1b2a; color: #e0e1dd; font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1b263b; padding: 20px; border-radius: 10px; }
        h2 { text-align: center; color: #415a77; }
        label { display: block; margin-top: 10px; font-size: 0.9em; }
        input { width: 100%; padding: 8px; margin-top: 5px; background: #0d1b2a; border: 1px solid #415a77; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #4e44ce; border: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .resultado-box { display: flex; justify-content: space-between; margin-top: 20px; }
        .card { background: #0d1b2a; padding: 15px; width: 45%; text-align: center; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Analisador de Escanteios -- Beta</h2>
    <p style="font-size: 0.8em; text-align: center;">Cole os valores da partida. O motor aplica regras e retorna sugestões para investir em escanteios.</p>

    <label>Minutos do jogo</label>
    <input type="number" placeholder="ex: 33">
    
    <label>Escanteios</label>
    <input type="number" placeholder="ex: 7">
    
    <label>Gols--Casa</label>
    <input type="number" placeholder="ex: 2">
    
    <label>Gols--Fora</label>
    <input type="number" placeholder="ex: 1">
    
    <label>Ataques -- Casa</label>
    <input type="number" placeholder="ex: 90">
    
    <label>Ataques -- Fora</label>
    <input type="number" placeholder="ex: 90">

    <button>Analisar Partida!</button>

    <div class="resultado-box">
        <div class="card">
            <strong>+8</strong><br>Qtn Corners
        </div>
        <div class="card">
            <strong>0%</strong><br>Probabilidade
        </div>
    </div>
</div>

</body>
</html>
